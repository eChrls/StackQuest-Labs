name: lab-3

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lab3}
      POSTGRES_USER: ${POSTGRES_USER:-lab3}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab3_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab3} -d ${POSTGRES_DB:-lab3}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: "no"
    logging: &default-logging
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  backend:
    build: {context: ./backend, dockerfile: Dockerfile}
    working_dir: /workspace
    volumes:
      - ./backend:/workspace
      - maven_cache:/root/.m2
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lab3}
      DB_USERNAME: ${POSTGRES_USER:-lab3}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lab3_dev}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:18083:8080"]
    command: ["mvn", "spring-boot:run", "-Dspring-boot.run.jvmArguments=-Dspring.profiles.active=default"]
    logging: *default-logging

  frontend:
    build: {context: ./frontend, dockerfile: Dockerfile}
    working_dir: /workspace
    volumes:
      - ./frontend:/workspace
      - frontend_node_modules:/workspace/node_modules
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:18083}
    ports: ["127.0.0.1:13003:5173"]
    command: ["sh", "-c", "npm install && npm run dev"]
    logging: *default-logging

  postgres-test:
    profiles: ["test"]
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_TEST_DB:-lab3_test}
      POSTGRES_USER: ${POSTGRES_USER:-lab3}
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-lab3_test}
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lab3} -d ${POSTGRES_TEST_DB:-lab3_test}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging: *default-logging

  backend-test:
    profiles: ["test"]
    build: {context: ./backend, dockerfile: Dockerfile}
    working_dir: /workspace
    volumes: ["./backend:/workspace", "maven_cache:/root/.m2"]
    environment:
      DB_URL: jdbc:postgresql://postgres-test:5432/${POSTGRES_TEST_DB:-lab3_test}
      DB_USERNAME: ${POSTGRES_USER:-lab3}
      DB_PASSWORD: ${POSTGRES_TEST_PASSWORD:-lab3_test}
      SPRING_PROFILES_ACTIVE: test
    depends_on:
      postgres-test: {condition: service_healthy}
    command: ["mvn", "test", "-Dspring.profiles.active=test", "--no-transfer-progress"]
    logging: *default-logging

  frontend-test:
    profiles: ["test"]
    build: {context: ./frontend, dockerfile: Dockerfile}
    working_dir: /workspace
    volumes: ["./frontend:/workspace", "frontend_node_modules:/workspace/node_modules"]
    command: ["sh", "-c", "npm install && npm test -- --run"]
    logging: *default-logging

  backend-debug:
    profiles: ["debug"]
    build: {context: ./backend, dockerfile: Dockerfile}
    working_dir: /workspace
    volumes: ["./backend:/workspace", "maven_cache:/root/.m2"]
    environment:
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lab3}
      DB_USERNAME: ${POSTGRES_USER:-lab3}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-lab3_dev}
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:18083:8080", "127.0.0.1:15007:5005"]
    command: ["sh", "-c", "mvn spring-boot:run -Dspring-boot.run.jvmArguments='-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005'"]
    logging: *default-logging

volumes:
  postgres_data:
  maven_cache:
  frontend_node_modules:
