name: Lab improvement
description: Propose a focused improvement to an existing Lab
title: "[Lab improvement]: "
labels: [lab-improvement]
body:
  - type: dropdown
    id: lab
    attributes: {label: Lab, options: [Lab 01, Lab 02, Lab 03, Lab 04, Lab 05, Lab 06, Lab 07, Lab 08, Lab 09+ / Community]}
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: Problem or opportunity}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed improvement, description: "Avoid root causes and solution code."}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Expected value and validation}
    validations: {required: true}
  - type: checkboxes
    id: baseline
    attributes:
      label: Baseline
      options:
        - label: This proposal does not disclose the challenge solution.
          required: true
