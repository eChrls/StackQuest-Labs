name: New Lab proposal
description: Propose an original, realistic Lab before implementation
title: "[New Lab]: "
labels: [new-lab]
body:
  - type: markdown
    attributes:
      value: "Read the editorial guide and LAB_SPEC first. Describe the challenge, not its solution."
  - type: dropdown
    id: roadmap_scope
    attributes:
      label: Roadmap scope
      options: [Official roadmap Lab, Community/Future Lab idea]
    validations: {required: true}
  - type: input
    id: directory
    attributes:
      label: Proposed directory
      description: "Use lab-NN-stack-focus for an official Lab; community ideas need not claim an official number."
    validations: {required: true}
  - type: input
    id: stack
    attributes:
      label: Stack and Docker architecture
      description: Languages, frameworks, data services, containers, and isolation approach.
    validations: {required: true}
  - type: checkboxes
    id: tracks
    attributes:
      label: Difficulty tracks
      options:
        - label: Easy
        - label: Intermediate
        - label: Advanced
    validations: {required: true}
  - type: textarea
    id: challenge
    attributes:
      label: Challenge type and target skills
      description: Debugging, feature, refactoring, SQL, data, incident, or review; and skills assessed.
    validations: {required: true}
  - type: textarea
    id: realism
    attributes:
      label: Context, realism, and value
      description: What real engineering situation does it simulate, and what does it add?
    validations: {required: true}
  - type: textarea
    id: inspiration
    attributes:
      label: Public inspiration or source
      description: Optional. Link only public material that informed the pattern; do not copy it.
  - type: textarea
    id: guidance
    attributes:
      label: Starting point and progressive hints
      description: Explain how guidance changes across the proposed difficulty tracks.
    validations: {required: true}
  - type: textarea
    id: tests
    attributes:
      label: Expected tests and acceptance criteria
      description: Describe observable baseline evidence and realistic completion criteria.
    validations: {required: true}
  - type: textarea
    id: external_services
    attributes:
      label: External services, costs, and secrets
      description: State the local/offline path, possible cost, and credential handling.
    validations: {required: true}
  - type: textarea
    id: continuity
    attributes:
      label: Agent Continuity context
      description: Explain what a new agent needs to teach, guide, validate, and fully resolve the Lab.
    validations: {required: true}
  - type: textarea
    id: follow_up
    attributes:
      label: Follow-up discussion
      description: What trade-off, review, production, or scalability questions should follow?
    validations: {required: true}
  - type: checkboxes
    id: originality
    attributes:
      label: Originality confirmation
      options:
        - label: This proposal is original and does not copy confidential or proprietary assessment material.
          required: true
