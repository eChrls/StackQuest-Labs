name: Documentation
description: Report missing, unclear, or incorrect documentation
title: "[Docs]: "
labels: [documentation]
body:
  - type: input
    id: location
    attributes: {label: Document or page}
    validations: {required: true}
  - type: textarea
    id: problem
    attributes: {label: Problem}
    validations: {required: true}
  - type: textarea
    id: suggestion
    attributes: {label: Suggested change}
  - type: checkboxes
    id: spoilers
    attributes:
      label: Spoiler check
      options:
        - label: This report contains no challenge solution or secrets.
          required: true
