spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/lab1}
    username: ${DB_USERNAME:lab1}
    password: ${DB_PASSWORD:lab1_dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
server:
  port: ${SERVER_PORT:8080}
